    <script>
      (function () {
        try {
          var saved = localStorage.getItem('nayan_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-[#FFFDF8] text-[#2D2229] dark:bg-[#1A1419] dark:text-[#FDF7F9] antialiased selection:bg-[#FFB6C1]/40">

  </body>
